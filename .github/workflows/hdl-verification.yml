# Simulates the VHDL and Verilog generated for components and checks it against the Logisim
# simulation model. See docs/hdl_verification.md.
#
# Runs automatically for changes to the sources, and manually from the Actions tab ("Run workflow"),
# optionally for one HDL or a subset of the test cases.

name: "HDL verification"
on:
  push:
    # main is left just for emergency cases.
    branches: [ main ]
    paths:
      - 'src/**/*.java'
      - 'src/test/hdl/**'
      - 'build.gradle.kts'
      - '.github/workflows/hdl-verification.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**/*.java'
      - 'src/test/hdl/**'
      - 'build.gradle.kts'
      - '.github/workflows/hdl-verification.yml'
  workflow_dispatch:
    inputs:
      language:
        description: 'HDL to verify'
        type: choice
        options:
          - both
          - vhdl
          - verilog
        default: both
      cases:
        description: 'Only run the test cases whose name matches this regular expression (empty: all), e.g. ^adder'
        type: string
        default: ''

env:
  JDK_VERSION: 21
  JDK_DISTRO: 'temurin'
  PYTHON_VERSION: '3.12'

jobs:
  hdl_verification:
    name: "VHDL (VUnit, GHDL) and Verilog (Icarus Verilog)"
    runs-on: ubuntu-latest

    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v7
    - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JDK_VERSION }}
        distribution: ${{ env.JDK_DISTRO }}
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Cache Gradle packages
      uses: actions/cache@v6
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        restore-keys: ${{ runner.os }}-gradle
    # Gradle downloads the simulators and sets up VUnit (task setUpHdlVerification)
    - name: Cache the simulators and VUnit
      uses: actions/cache@v6
      with:
        path: .gradle/hdl-verification
        key: ${{ runner.os }}-hdl-verification-${{ hashFiles('src/test/hdl/setup_environment.py', 'src/test/hdl/requirements.txt') }}
    - name: "Run the HDL verification suite"
      env:
        # passed through the environment, so the inputs cannot inject shell code
        HDL_LANGUAGE: ${{ inputs.language || 'both' }}
        HDL_CASES: ${{ inputs.cases }}
      run: |
        case "$HDL_LANGUAGE" in
          vhdl) task=hdlVerificationVhdl ;;
          verilog) task=hdlVerificationVerilog ;;
          *) task=hdlVerification ;;
        esac
        options=(--continue)
        if [ -n "$HDL_CASES" ]; then options+=("-PhdlCases=$HDL_CASES"); fi
        chmod +x gradlew
        ./gradlew "$task" "${options[@]}"
    - name: "Upload results"
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: hdl-verification-results
        path: |
          build/test-results/hdlVerificationVhdl/
          build/test-results/hdlVerificationVerilog/
          build/hdl-verification/suite/
        if-no-files-found: ignore
